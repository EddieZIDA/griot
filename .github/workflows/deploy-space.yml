# Déploiement : pousse le code vers le Space Hugging Face à chaque
# modification de la branche main (après passage des tests).
#
# Secret du dépôt GitHub : HF_TOKEN (écriture).
# Variable du dépôt GitHub : GRIOT_SPACE_ID (ex. "EddieZIDA/griot").
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GRIOT_SPACE_ID: ${{ vars.GRIOT_SPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pousser vers le Space
        run: |
          git push --force \
            "https://${GRIOT_SPACE_ID%%/*}:${HF_TOKEN}@huggingface.co/spaces/${GRIOT_SPACE_ID}" \
            HEAD:main
