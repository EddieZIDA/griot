# Déploiement : pousse le code vers le Space Hugging Face à chaque
# modification de la branche main (après passage des tests).
#
# Secret du dépôt GitHub : HF_TOKEN (écriture).
# Variable du dépôt GitHub : GRIOT_SPACE_ID (ex. "EddieZIDA/griot").
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GRIOT_SPACE_ID: ${{ vars.GRIOT_SPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pousser vers le Space
        run: |
          # Un espace ou un retour à la ligne collé par mégarde dans le
          # secret rend l'URL invalide ("Port number was not a decimal
          # number") : on nettoie les deux valeurs avant de s'en servir.
          TOKEN="$(printf '%s' "$HF_TOKEN" | tr -d '[:space:]')"
          SPACE="$(printf '%s' "$GRIOT_SPACE_ID" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ] || [ -z "$SPACE" ]; then
            echo "HF_TOKEN (secret) ou GRIOT_SPACE_ID (variable) manquant."
            exit 1
          fi
          # Un jeton Hugging Face ne contient que "hf_" suivi de lettres
          # et de chiffres. Tout autre contenu signale un secret mal saisi.
          if ! printf '%s' "$TOKEN" | grep -Eq '^hf_[A-Za-z0-9]+$'; then
            echo "Le secret HF_TOKEN n'a pas la forme d'un jeton Hugging Face"
            echo "(attendu : hf_ suivi de lettres et chiffres, rien d'autre)."
            echo "Longueur reçue : ${#TOKEN} caractères."
            exit 1
          fi
          # Jeton transmis par en-tête, jamais dans l'URL.
          AUTH="$(printf '%s:%s' "${SPACE%%/*}" "$TOKEN" | base64 -w0)"
          git -c http.extraheader="Authorization: Basic ${AUTH}" push --force \
            "https://huggingface.co/spaces/${SPACE}" HEAD:main
